<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start free · Aqona</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#0B6FB8;--paper:#CFE4F5;--ink:#0A2A4A;--soft:#33506E;--ground:#E9EDF1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  a{color:var(--ink)}a:hover{color:var(--accent)}
  .hide{display:none!important}
  .page{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:14px;display:flex;flex-direction:column;gap:14px}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 0}
  .brand{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.03em;text-decoration:none}.brand b{color:var(--accent)}
  .bar a.link{font-size:14px;font-weight:800;min-height:44px;display:flex;align-items:center}
  form{flex:1;display:flex;flex-direction:column;min-height:0}
  .top{flex:1;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-top:0;border-radius:4px 4px 0 0;position:relative;padding:24px 19px 18px}
  .scallop{position:absolute;left:-3px;right:-3px;top:-1px;height:10px;background:radial-gradient(circle at 8px 0,var(--ground) 7px,transparent 7.5px) repeat-x;background-size:16px 10px}
  .eyebrow{display:flex;justify-content:space-between;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  h1{margin:14px 0 0;font-family:Anton,Impact,sans-serif;font-weight:400;line-height:.92;display:flex;flex-direction:column}
  h1 span:first-child{margin-bottom:6px}
  label{font-size:14px;font-weight:700}
  input{margin-top:8px;font:inherit;font-size:17px;color:var(--ink);height:52px;padding:0 14px;border:2px solid var(--ink);border-radius:4px;background:#fff;width:100%}
  input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .google{margin-top:auto;font:inherit;font-size:16px;font-weight:800;height:54px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
  .btn{margin-top:10px;font:inherit;font-size:17px;font-weight:800;height:56px;border:3px solid var(--ink);border-radius:4px;background:var(--accent);color:#fff;cursor:pointer;width:100%}
  .err{margin-top:10px;font-size:14px;font-weight:700;color:#B42318}.err:empty{display:none}
  .tear{height:26px;flex:none;background:var(--paper);position:relative}
  .tear::before,.tear::after{content:"";position:absolute;top:0;width:26px;height:26px;border-radius:50%;background:var(--ground)}
  .tear::before{left:-13px}.tear::after{right:-13px}
  .tear i{position:absolute;left:20px;right:20px;top:11px;border-top:4px dotted var(--ink);opacity:.55}
  .stub{height:120px;flex:none;background:var(--paper);border:3px solid var(--ink);border-top:0;border-radius:0 0 6px 6px;padding:6px 19px 14px;display:flex;gap:16px;align-items:stretch}
</style></head><body>
<div class="page">
  <div class="bar">
    <a class="brand" href="/"><b>aqo</b>na</a>
    <a class="link" href="/login">Log in</a>
  </div>
  <form onsubmit="withEmail(event)">
    <div class="top">
      <div class="scallop"></div>
      <div class="eyebrow"><span>Free plan</span><span>No card needed</span></div>
      <h1><span style="font-size:46px">Your queue,</span><span style="font-size:86px">ticket #1</span></h1>

      <label for="biz" style="margin-top:20px">Business or queue name</label>
      <input id="biz" autocomplete="organization" maxlength="60" required oninput="preview()" placeholder="Ana's Milk Tea">
      <div style="margin-top:6px;font-size:13px">Your QR will open <b style="word-break:break-all" id="addr"></b></div>

      <label for="you" style="margin-top:16px">Your name</label>
      <input id="you" autocomplete="name" maxlength="60" placeholder="Ana Reyes">

      <button type="button" class="google hide" id="googleBtn" onclick="withGoogle()"><svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>Continue with Google</button>
      <button class="btn hide" id="emailBtn">Continue with email</button>
      <p id="noMethods" class="hide" style="margin:auto 0 0;font-size:15px"><b>Sign-up isn't open yet.</b> Please check back soon.</p>
      <div class="err" id="err" role="alert"></div>
    </div>
    <div class="tear"><i></i></div>
    <div class="stub">
      <div style="font-family:Anton,Impact,sans-serif;font-size:44px;line-height:1;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center">FREE</div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:13px;line-height:1.4">
        <b style="font-size:14px">1 queue · owner + 2 staff · lock-screen alerts</b>
        <span>No password: Google or a code by email. By continuing you agree to the <a href="/privacy">Privacy notice</a>.</span>
      </div>
    </div>
  </form>
</div>
<script>
const METHODS = __METHODS__;
const $ = id => document.getElementById(id);
$('googleBtn').classList.toggle('hide', !METHODS.google);
$('emailBtn').classList.toggle('hide', !METHODS.email);
$('noMethods').classList.toggle('hide', METHODS.google || METHODS.email);
if (METHODS.google && !METHODS.email) $('googleBtn').style.marginTop = 'auto';

// Same rule as the server's slug (src/slug.ts), for the preview only; the real address is made on the server.
const slugify = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/g, '');
function preview(){ $('addr').textContent = location.host + '/q/' + (slugify($('biz').value) || 'your-shop'); }
try { const s = JSON.parse(sessionStorage.getItem('aqonaStart') || 'null'); if (s) { $('biz').value = s.businessName || ''; $('you').value = s.yourName || ''; } } catch(e){}
preview();

// The names wait in this tab until sign-in is done; the dashboard then creates the workspace and queue.
function remember(){
  const businessName = $('biz').value.trim();
  if (!businessName) { $('err').textContent = 'Please enter your business or queue name.'; $('biz').focus(); return false; }
  try { sessionStorage.setItem('aqonaStart', JSON.stringify({ businessName, yourName: $('you').value.trim() })); } catch(e){}
  return true;
}
function withEmail(e){ e.preventDefault(); if (remember()) location.href = '/login?next=/app'; }
async function withGoogle(){
  if (!remember()) return;
  try {
    const r = await fetch('/api/auth/sign-in/social', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider: 'google', callbackURL: '/app' }) });
    const d = await r.json();
    if (d.url) location.href = d.url; else throw new Error();
  } catch(err) { $('err').textContent = 'Google sign-in is not available right now. Please try again.'; }
}
</script>
</body></html>
