<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're invited · Aqona</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#0B6FB8;--paper:#CFE4F5;--ink:#0A2A4A;--soft:#33506E;--ground:#E9EDF1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  a{color:var(--ink)}a:hover{color:var(--accent)}
  .hide{display:none!important}
  .page{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:14px;display:flex;flex-direction:column;gap:14px}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 0}
  .brand{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}.brand b{color:var(--accent)}
  .top{background:#fff;border:3px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;padding:22px 19px 18px;display:flex;flex-direction:column}
  .eyebrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  h1{margin:16px 0 0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:56px;line-height:.95}
  p{margin:12px 0 0;font-size:15px;line-height:1.5}
  .btn{margin-top:20px;font:inherit;font-size:17px;font-weight:800;min-height:56px;border:3px solid var(--ink);border-radius:4px;background:var(--accent);color:#fff;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .btn:hover{color:#fff}
  .btn.plain{background:#fff;color:var(--ink);border-width:2px}.btn.plain:hover{color:var(--ink)}
  .note{margin-top:14px;font-size:13px;line-height:1.5;color:var(--soft)}
  .err{margin-top:12px;font-size:14px;font-weight:700;color:#B42318}.err:empty{display:none}
  button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  /* Side notches are real holes with an ink rim: rim outer radius = half the height, rim width = the 3px side border. */
  .tear{height:30px;position:relative;background:radial-gradient(circle at 0 50%,transparent 12px,var(--ink) 12.5px 15px,#fff 15.5px) left/50% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 12px,var(--ink) 12.5px 15px,#fff 15.5px) right/50% 100% no-repeat}
  .tear i{position:absolute;left:20px;right:20px;top:13px;border-top:4px dotted var(--ink);opacity:.4}
  .stub{background:var(--paper);border:3px solid var(--ink);border-top:0;border-radius:0 0 6px 6px;padding:10px 19px 16px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}
  .foot{margin-top:auto;display:flex;justify-content:center;gap:22px;padding-bottom:8px;font-size:13px;font-weight:600}
  .foot a{color:var(--soft)}
</style></head><body>
<div class="page">
  <div class="bar"><a class="brand" href="/"><b>aqo</b>na</a></div>
  <div>
    <div class="top">
      <div class="eyebrow"><span>Staff pass</span><span id="shopTop"></span></div>
      <h1 id="title">You're on the team.</h1>
      <p id="lead"></p>
      <div id="actions"></div>
      <div class="err" id="err" role="alert"></div>
    </div>
    <div class="tear"><i></i></div>
    <div class="stub"><b style="font-size:14px">Invites work for 7 days.</b><span>Got this link by Messenger or WhatsApp? That's fine. Sign in with the email it was sent to.</span></div>
  </div>
  <div class="foot"><a href="/privacy">Privacy notice</a><a href="/">Home</a></div>
</div>
<script>
const INVITE = __INVITE__;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const here = location.pathname;
$('shopTop').textContent = INVITE.shop || '';

async function signOut(){
  try { await fetch('/api/auth/sign-out', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); } catch(e){}
  location.reload();
}
async function accept(){
  $('err').textContent = '';
  $('actions').innerHTML = '<p><b>Joining ' + esc(INVITE.shop) + '…</b></p>';
  try {
    const r = await fetch('/api/app/invites/' + INVITE.id + '/accept', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Could not join. Please try again.');
    location.replace(d.slug ? '/q/' + d.slug + '/staff' : '/app');
  } catch(e) {
    $('err').textContent = e.message;
    $('actions').innerHTML = '<button class="btn" onclick="accept()">Try again</button>';
  }
}

if (INVITE.state !== 'ok') {
  $('title').textContent = { missing: 'Invite not found.', canceled: 'Invite cancelled.', used: 'Invite already used.', expired: 'Invite expired.' }[INVITE.state] || 'Invite not found.';
  $('lead').textContent = 'Ask the shop owner to send you a new link from their Team page.';
  $('actions').innerHTML = INVITE.state === 'used' && INVITE.me ? '<a class="btn" href="/app">Open my dashboard</a>' : '<a class="btn plain" href="/">Go to the home page</a>';
} else {
  $('lead').innerHTML = '<b>' + esc(INVITE.inviter || 'The owner') + '</b> invited <b>' + esc(INVITE.email) + '</b> to run the counter at <b>' + esc(INVITE.shop) + '</b>.';
  const me = (INVITE.me || '').toLowerCase();
  if (!me) {
    $('actions').innerHTML = '<a class="btn" href="/login?next=' + encodeURIComponent(here) + '">Sign in to join</a>' +
      '<div class="note">Use <b>' + esc(INVITE.email) + '</b> (Google or a code by email). You\'ll go straight to the counter.</div>';
  } else if (me === INVITE.email.toLowerCase()) {
    accept();   // signed in with the invited email: join straight away
  } else {
    $('actions').innerHTML = '<p>You\'re signed in as <b>' + esc(INVITE.me) + '</b>. This invite is for <b>' + esc(INVITE.email) + '</b>.</p>' +
      '<button class="btn" onclick="signOut()">Sign out and use ' + esc(INVITE.email) + '</button>';
  }
}
</script>
</body></html>
