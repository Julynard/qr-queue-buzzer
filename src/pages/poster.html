<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan to join the queue</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--accent:#0B6FB8;--ink:#0F1115;--soft:#545B66;--mute:#6B7280}
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9EDF1}
  .sheet{width:794px;height:1123px;margin:24px auto;background:#fff;color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:64px 72px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;box-shadow:0 2px 12px rgba(10,42,74,.12)}
  .sg{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700}
  .badge{width:56px;height:56px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{margin:12px 0 0;font-size:64px;letter-spacing:-.03em;line-height:1.05}
  .lead{margin:0;font-size:24px;line-height:1.45;color:var(--soft);max-width:560px}
  .qrframe{width:400px;height:400px;padding:24px;border:6px solid var(--accent);border-radius:32px;display:flex;align-items:center;justify-content:center}
  #qr img,#qr canvas{width:340px!important;height:340px!important;display:block}
  .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;width:100%;margin-top:8px}
  .step{display:flex;flex-direction:column;align-items:center;gap:10px}
  .step i{font-style:normal;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  .step b{font-size:20px;font-weight:600}.step span{font-size:16px;color:var(--soft)}
  .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
  .print{position:fixed;top:16px;right:16px;font:600 15px Inter,system-ui,sans-serif;min-height:44px;padding:0 18px;border:2px solid #0A2A4A;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
  @page{size:A4;margin:0}
  @media print{html,body{background:#fff}.sheet{margin:0;box-shadow:none;width:210mm;height:297mm}.print{display:none}}
  @media (max-width:793px){.sheet{zoom:.45;margin:12px auto}}
</style></head><body>
<button class="print" onclick="print()">Print</button>
<div class="sheet">
  <div style="display:flex;align-items:center;gap:14px" id="shopRow">
    <div class="badge sg" id="badge" aria-hidden="true"></div>
    <div style="font-weight:600;font-size:26px" id="shop">__QUEUE_NAME__</div>
  </div>

  <h1 class="sg">Scan to join the queue</h1>
  <p class="lead">We'll buzz your phone when your order is ready. Sit down, walk around, no need to wait in line.</p>

  <div class="qrframe"><div id="qr" role="img" aria-label="QR code that opens the join page"></div></div>

  <div class="steps">
    <div class="step"><i class="sg">1</i><b>Scan</b><span>Use your phone camera</span></div>
    <div class="step"><i class="sg">2</i><b>Join</b><span>Name is optional</span></div>
    <div class="step"><i class="sg">3</i><b>Allow alerts</b><span>We buzz you, even locked</span></div>
  </div>

  <div class="foot">
    <div style="font-size:16px;color:var(--soft)">No app · No sign-up · No phone number</div>
    <div class="sg" style="font-size:22px;letter-spacing:-.02em"><span style="color:var(--accent)">aqo</span>na <span style="font-family:Inter,sans-serif;font-weight:400;font-size:16px;color:var(--mute)">· Ako na!</span></div>
  </div>
</div>
<script>
new QRCode(document.getElementById('qr'), { text: '__JOIN__', width: 680, height: 680, colorDark: '#0F1115', colorLight: '#FFFFFF' });
// Badge: initials of the shop name (the part before " · ").
const shop = document.getElementById('shop').textContent.split(' · ')[0];
if (!shop.trim()) document.getElementById('shopRow').style.display = 'none';
document.getElementById('badge').textContent = shop.split(/\s+/).filter(w => /^[\p{L}\p{N}]/u.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'Q';
</script>
</body></html>
